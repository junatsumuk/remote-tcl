name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Remote TCL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Grant execute permission for gradlew (if exists)
        run: |
          if [ -f "gradlew" ]; then chmod +x gradlew; fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Create Release and Prepare Direct APK URL
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f version.md ]; then
            VER_NUM=$(head -n 1 version.md | tr -d '\r\n[:space:]')
          else
            VER_NUM="${{ github.run_number }}"
          fi

          VERSION="0.0.${VER_NUM}"
          APK_NAME="RemoteTCL-${VERSION}.apk"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          # Copy APK to versioned name
          cp "$APK_PATH" "$APK_NAME"

          # Delete existing release with same tag if exists
          gh release delete "$VERSION" --yes || true

          # Create GitHub Release with direct .apk download asset
          gh release create "$VERSION" "$APK_NAME" \
            --title "Release $VERSION" \
            --notes "Automated build for Remote TCL commit ${{ github.sha }}"

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${APK_NAME}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_release.outputs.apk_name }}
          path: ${{ steps.create_release.outputs.apk_name }}

      - name: Send WhatsApp Notification
        if: success()
        env:
          DOWNLOAD_URL: ${{ steps.create_release.outputs.download_url }}
          VERSION: ${{ steps.create_release.outputs.version }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)

          MSG=$(printf "📺 *Remote TCL App - Build Sukses!*\n\n📦 *Versi:* %s\n📝 *Commit:* %s\n\n📥 *Download APK Langsung:*\n%s" "${VERSION}" "${COMMIT_MSG}" "${DOWNLOAD_URL}")

          PAYLOAD=$(jq -n \
            --arg phone "62895411271657@s.whatsapp.net" \
            --arg msg "$MSG" \
            '{phone: $phone, message: $msg}')

          curl -s -X POST "https://apiujiwa.aplikasibisnis.my.id/send/message" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
